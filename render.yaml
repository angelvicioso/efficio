# Render Blueprint for the Efficio POC (D-023, D-024).
# Render reads this file when you create a "Blueprint" from the repository.
# Setup steps: docs/deploy/render.md
services:
  - type: web
    name: efficio
    runtime: node
    # Ohio: the closest Render region to Houston
    region: ohio
    # Needs an always-on plan with a disk; the free plan sleeps and has no persistent disk.
    plan: starter
    branch: claude/logistics-platform-poc-x95492
    rootDir: web
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # One server only: the database is a single file and the refresh schedule runs in-process.
    numInstances: 1
    disk:
      name: efficio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EFFICIO_DB_PATH
        value: /var/data/efficio.db
      # Settings you change in Render's dashboard. `sync: false` means Render asks for them when the
      # service is first created and never overwrites them from this file afterwards (D-039).
      # A value here would reset the dashboard on every push: that's how PORT_ADAPTER went back to mock.
      #   PORT_ADAPTER: navis (live Port Houston) or mock (simulated); unset = mock
      #   REFRESH_INTERVAL_MINUTES: unset = 5
      #   EMAIL_MODE: preview, postmark or off (docs/deploy/email.md); unset = preview
      - key: PORT_ADAPTER
        sync: false
      - key: REFRESH_INTERVAL_MINUTES
        sync: false
      - key: EMAIL_MODE
        sync: false
      # Random secrets generated by Render. Find them under the service's Environment tab.
      - key: EFFICIO_SETUP_TOKEN
        generateValue: true
      - key: REFRESH_TOKEN
        generateValue: true
